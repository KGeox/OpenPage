{% extends 'main.html' %}

{% block content %}

<div>

    <form method="POST" enctype="multipart/form-data" action="" >

        {% csrf_token %}
        <div class="book_design">

            <div style="border-radius: 20px; background: var(--card_bot); padding:10px; display: grid;">
                summary {{ form.summary }}
                title {{ form.title }}
                By {{ form.author }}
                genre {{ form.genre }}
                image {{ form.image }}
            </div>

            <div style="border-radius: 20px; justify-content: center; align-items: center;">
                <img id="image_preview" src="#" alt="Book image preview" style=" width: 480px; height: 640px; border-radius: 20px; margin: auto" />
            </div>

        </div>

        <input type="submit" value="Submit" >

    </form>

</div>



















    <script>
        const imageInput=document.getElementById('id_image');
        const imagePreview = document.getElementById('image_preview');

        if (imageInput) {
            imageInput.addEventListener('change', function(){
                const file =this.files[0];
                if (file) {
                    const reader = new FileReader();

                    reader.addEventListener('load', function() {
                        imagePreview.setAttribute('src', this.result);
                        imagePreview.style.display = 'block';
                    });

                    reader.readAsDataURL(file);
                }
                else {
                    imagePreview.style.display= 'none';
                }
            });
        }
    </script>


{% endblock %}
